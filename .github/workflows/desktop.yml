# Builds the desktop installers on GitHub's Windows and Linux machines.
# Start it from the Actions tab ("Run workflow"), or by pushing a tag like v0.2.0.
# The installers appear as downloadable files on the finished run.
# Without a server address the app is self-contained (browser mode: data kept on that computer).
# With a server address it connects to that Factory Atlas server instead (server mode).
name: Desktop installers

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "Server address for server mode (leave empty for a self-contained app)"
        required: false
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis,msi
            name: windows
          - os: ubuntu-22.04
            bundles: deb,appimage
            name: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux build libraries
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev libssl-dev
      - run: npm ci
      - name: Build web app (self-contained)
        if: ${{ !inputs.api_base_url }}
        run: npm run build -w web -- --mode browser
      - name: Build web app (connects to a server)
        if: ${{ inputs.api_base_url }}
        run: npm run build -w web -- --mode server
        env:
          API_BASE_URL: ${{ inputs.api_base_url }}
      - name: Build installers
        working-directory: desktop
        run: npx tauri build --bundles ${{ matrix.bundles }}
      - uses: actions/upload-artifact@v4
        with:
          name: factory-atlas-${{ matrix.name }}
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/deb/*.deb
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
